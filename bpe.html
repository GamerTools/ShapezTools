<!DOCTYPE html>
<html>
<head>
    <title>Shapez2 Blueprint Creator</title>
    <style>
        body {
            background: #222;
            color: #eee;
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, textarea, button {
            background: #333;
            color: #eee;
            border: 1px solid #555;
            margin: 8px 0;
            width: 100%;
        }
        textarea { height: 200px; }
        textarea::placeholder, input::placeholder {
            color: #888;
        }
        button {
            border: 1px solid #888;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>
    <form style="max-width: 1000px; margin: 0 auto; background: #292929; padding: 32px; border-radius: 12px; box-shadow: 0 2px 12px #0004;">
        <h2 style="text-align:center; margin-bottom: 24px;">Shapez2 Blueprint Creator</h2>
        <div style="margin-bottom: 18px;">
            <label for="input" style="display:block; margin-bottom:8px; font-weight:bold;">Input list of shape codes or integers</label>
            <textarea id="input" placeholder="Enter one per line" style="height:120px; resize:vertical;"></textarea>
        </div>
        <button type="button" onclick="runScript()" style="width:100%; padding:12px; font-size:1.1em; background:#444; color:#fff; border-radius:6px; border:none; cursor:pointer;">Create Blueprint</button>
        <div style="margin-top: 24px;">
            <label for="output" style="display:block; margin-bottom:8px; font-weight:bold;">Output blueprint</label>
            <textarea id="output" readonly placeholder="Blueprint string will appear here" style="height:200px; resize:vertical;"></textarea>
        </div>
    </form>
    <script>
        const ENCODING = "utf-8";
        const BP_SIG = "SHAPEZ2-3-";
        const SIGNAL_TYPE = "ConstantSignalDefaultInternalVariant";
        const EMPTY_BP = {
	        "V": 1122,
	        "BP": {
         	"$type": "Building",
  	        "Icon": {"Data": ["icon:Buildings", null, null, "shape:CuCuCuCu"]},
          	"Entries": [],
  	        "BinaryVersion": 1122
	        }
        };

        function chr(byte) {
            return String.fromCharCode(byte);
        }

        function isAllDigits(str) {
            return /^\d+$/.test(str);
        }

        function encodeValue(value) {
	        if (isAllDigits(value)) {
		        const num = Number(value);
		        v = "\x03" + chr(num & 0xff) + chr((num >> 8) & 0xff) + "\x00\x00";
	        } else {
		        // TODO: verify shape code
		        v = "\x06\x01\x01" + chr(value.length) + "\x00"  + value;
            }
            return btoa(v);
        }

        const MAX_X = 16;
        function makeConstants(text) {
            data = [];
            num = 0;
            lines = text.trim().split('\n');
            for(line of lines) {
                value = line.trim();
                if (value === "") continue;
                ent = {};
                ent["X"] = num % MAX_X;
                ent["Y"] = Math.floor(num / MAX_X);
                ent["R"] = 3;
                ent["T"] = SIGNAL_TYPE;
                ent["C"] = encodeValue(value);
                data.push(ent);
                num = num + 1;
            }
            bp = EMPTY_BP;
            bp["BP"]["Entries"] = data;
            const jdata = JSON.stringify(bp);
            console.log(jdata);
            return BP_SIG + btoa(String.fromCharCode(...pako.gzip(jdata))) + "$";
        }

        async function runScript() {
            const userInput = document.getElementById('input').value;
            document.getElementById('output').value = makeConstants(userInput)
        }
    </script>
</body>
</html>
